<title>Facility Inventory Floor Plan — Theory Wellness Sigma Plugin</title>

<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,Inter,Segoe UI,Roboto,Arial,sans-serif;background:transparent;color:#14231C;overflow:hidden}
  #wrap{height:100%;display:flex;flex-direction:column;padding:10px 14px;gap:8px}
  #top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  #ttl{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#2E7D4F}
  #roles{display:flex;gap:4px}
  .role{font-size:11px;padding:4px 10px;border-radius:14px;border:1px solid #C9D6CE;background:#fff;color:#4A5B52;cursor:pointer}
  .role.on{background:#14231C;color:#fff;border-color:#14231C}
  #kpis{display:flex;gap:8px;flex-wrap:wrap}
  .kpi{flex:1;min-width:120px;background:#fff;border:1px solid #DCE6DF;border-radius:8px;padding:6px 10px}
  .kpi small{display:block;font-size:10px;color:#6B7B72;text-transform:uppercase;letter-spacing:.04em}
  .kpi b{font-size:18px}
  #warn{display:none;background:#FDECEA;border:1px solid #E5A29B;color:#8E2418;border-radius:8px;padding:6px 10px;font-size:12px}
  #warn b{font-weight:800}
  #main{flex:1;min-height:0;display:flex;gap:10px}
  #stage{flex:1 1 62%;min-width:0;position:relative}
  svg#map{width:100%;height:100%;display:block}
  #side{flex:0 0 36%;min-width:230px;overflow:auto;background:#fff;border:1px solid #DCE6DF;border-radius:8px;padding:10px 12px}
  #side h3{font-size:14px;margin-bottom:2px}
  #side .sub{font-size:11px;color:#6B7B72;margin-bottom:8px}
  .row{margin-bottom:9px;font-size:11px}
  .row .hd{display:flex;justify-content:space-between;gap:6px;margin-bottom:2px}
  .row .hd span:last-child{color:#4A5B52;white-space:nowrap}
  .bar{height:9px;background:#EDF2EE;border-radius:5px;position:relative;overflow:hidden}
  .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px 0 0 5px}
  .bar u{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(46,125,79,.0) 0 3px,rgba(46,125,79,.45) 3px 6px)}
  .tanks{display:flex;gap:10px;margin:6px 0 10px}
  .tank{flex:1;text-align:center;font-size:10px;color:#4A5B52}
  .tank .cyl{height:90px;border:2px solid #14231C;border-radius:6px 6px 14px 14px;background:#F4F8F5;position:relative;overflow:hidden;margin:0 auto 4px;width:44px}
  .tank .cyl i{position:absolute;left:0;right:0;bottom:0}
  .tank b{display:block;font-size:11px;color:#14231C}
  #legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10px;color:#6B7B72}
  .sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}
  .room{cursor:pointer}
  .room:hover rect.b{stroke:#14231C;stroke-width:3}
  .room.sel rect.b{stroke:#14231C;stroke-width:4}
  text{font-family:inherit;pointer-events:none}
</style>
</head>

  function drawMap(rm){
    var svg=$('map');svg.innerHTML='';
    el('rect',{x:320,y:220,width:1100,height:1050,fill:'#F4F8F5',rx:10},svg);
    var defsEl=el('defs',{},svg);
    var pat=el('pattern',{id:'hatch',width:8,height:8,patternUnits:'userSpaceOnUse',patternTransform:'rotate(45)'},defsEl);
    el('rect',{width:8,height:8,fill:'#fff'},pat);el('rect',{width:4,height:8,fill:'#2E7D4F',opacity:.35},pat);
    Object.keys(G).forEach(function(k){
      var g=G[k],list=rm[k]||[],a=agg(list),ar=list.map(function(r){return r.area;});
      var dim=!inRole(ar.length?ar:['__']);
      var over=a.proj>1.0001;
      var grp=el('g',{'class':'room'+(k===sel?' sel':''),opacity:dim?.28:(flowOn?.55:1)},svg);
      grp.addEventListener('click',function(){sel=k;pushSel();render();});
      var vert=g[5]===1;
      el('rect',{'class':'b',x:g[0],y:g[1],width:g[2],height:g[3],rx:6,fill:list.length?color(a.fill,false):'#E6EBE8',opacity:.9,stroke:over?'#D9473B':'#14231C','stroke-width':over?4:1.5,'stroke-dasharray':over?'8 4':'0'},grp);
      if(a.pl>0&&a.cap){ // planned strip along the bottom
        var pw=Math.min(a.pl/a.cap,1-Math.min(a.fill,1))*(vert?g[3]:g[2]);
        if(pw>0.5){ if(vert) el('rect',{x:g[0]+2,y:g[1]+g[3]-2-pw,width:g[2]-4,height:pw,fill:'url(#hatch)',stroke:'#2E7D4F','stroke-dasharray':'3 2','stroke-width':1.2},grp);
          else el('rect',{x:g[0]+g[2]-2-pw,y:g[1]+2,width:pw,height:g[3]-4,fill:'url(#hatch)',stroke:'#2E7D4F','stroke-dasharray':'3 2','stroke-width':1.2},grp);}
      }
      var tx=g[0]+g[2]/2,ty=k==='Warehouse'?g[1]+40:g[1]+g[3]/2;
      var t=el('text',{x:tx,y:ty,'text-anchor':'middle','font-size':vert?15:(g[3]<60?17:21),'font-weight':700,fill:'#14231C'},grp);
      if(vert){t.setAttribute('transform','rotate(-90 '+(tx-9)+' '+ty+')');t.setAttribute('x',tx-9);}
      t.textContent=g[4];
      if(list.length){var p=el('text',{x:tx,y:vert?ty:ty+(g[3]<60?0:22),'text-anchor':'middle','font-size':16,fill:'#14231C'},grp);
        if(vert){p.setAttribute('transform','rotate(-90 '+(tx+19)+' '+ty+')');p.setAttribute('x',tx+19);p.setAttribute('font-size',13);}
        else if(g[3]<60){t.setAttribute('x',g[0]+10);t.setAttribute('text-anchor','start');p.setAttribute('x',g[0]+g[2]-10);p.setAttribute('text-anchor','end');}
        p.textContent=Math.round(a.fill*100)+'%'+(a.pl?' → '+Math.round(a.proj*100)+'%':'');}
    });
    if(flowOn){
      var mk=el('defs',{},svg);
      Object.keys(FCOL).forEach(function(c){var m=el('marker',{id:'ah-'+c,viewBox:'0 0 10 10',refX:8,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'},mk);el('path',{d:'M0 0L10 5L0 10z',fill:FCOL[c]},m);});
      function ctr(k){var g=G[k];return [g[0]+g[2]/2,g[1]+g[3]/2];}
      FLOW.forEach(function(e){
        if(!G[e[0]]||!G[e[1]])return;
        var a=ctr(e[0]),b=ctr(e[1]);
        var dx=b[0]-a[0],dy=b[1]-a[1],L=Math.sqrt(dx*dx+dy*dy)||1,nx=-dy/L*24,ny=dx/L*24;
        var cx=(a[0]+b[0])/2+nx,cy=(a[1]+b[1])/2+ny;
        el('path',{d:'M'+a[0]+' '+a[1]+' Q'+cx+' '+cy+' '+b[0]+' '+b[1],fill:'none',stroke:FCOL[e[3]],'stroke-width':3.5,opacity:.9,'stroke-dasharray':e[3]==='raw'?'8 6':'0','marker-end':'url(#ah-'+e[3]+')'},svg);
        var src=(rm[e[0]]||[]),mx=(a[0]+b[0])/4+cx/2,my=(a[1]+b[1])/4+cy/2;
        var on=src.reduce(function(t,r){return t+r.onhand;},0),u=src.length?src[0].unit:'';
        var txt=e[2]+(src.length&&u!=='gal'?' \u00b7 '+fmt(on)+' '+u:'');
        var w=txt.length*6.6+14;
        el('rect',{x:mx-w/2,y:my-12,width:w,height:22,rx:11,fill:'#fff',stroke:FCOL[e[3]],'stroke-width':1.5},svg);
        el('text',{x:mx,y:my+4,'text-anchor':'middle','font-size':12,'font-weight':700,fill:FCOL[e[3]]},svg).textContent=txt;});
    }
    // beverage pallet grid inside warehouse
    var cells=[],bp=bevPallets();
    var colors={'Blood Orange':'#E8803A','Blueberry Lemonade':'#4D6FB3','Peach Mango':'#E5A06B','Watermelon Lime':'#5DAF6A','':'#8C9A93'};
    bp.forEach(function(r){for(var i=0;i<r.cap;i++)cells.push({c:colors[r.flavor]||'#8C9A93',st:i<r.onhand?'on':(i<r.onhand+r.planned?'pl':'free')});
      for(var j=0;j<Math.max(0,r.onhand+r.planned-r.cap);j++)cells.push({c:'#D9473B',st:'over'});});
    var gx=1128,gy=470,cw=36,ch=26,perRow=6;
    el('text',{x:gx,y:gy-12,'font-size':15,'font-weight':700,fill:'#14231C'},svg).textContent='Beverage pallet positions';
    cells.forEach(function(c,i){var x=gx+(i%perRow)*(cw+3),y=gy+Math.floor(i/perRow)*(ch+3);
      var a={x:x,y:y,width:cw,height:ch,rx:3};
      if(c.st==='on'){a.fill=c.c;a.stroke=c.c;}else if(c.st==='pl'){a.fill='url(#hatch)';a.stroke=c.c;a['stroke-dasharray']='4 2';a['stroke-width']=2;}
      else if(c.st==='over'){a.fill='#FDECEA';a.stroke='#D9473B';a['stroke-width']=2;}else{a.fill='#fff';a.stroke='#C9D6CE';}
      el('rect',a,svg);if(c.st==='over'){var tt=el('text',{x:x+cw/2,y:y+19,'text-anchor':'middle','font-size':16,'font-weight':800,fill:'#D9473B'},svg);tt.textContent='✕';}});
  }

  function bar(r){
    var f=r.cap?r.onhand/r.cap:0,pl=r.cap?Math.min(r.planned/r.cap,Math.max(0,1-f)):0,over=r.onhand+r.planned>r.cap;
    return '<div class="row"><div class="hd"><span><b>'+(r.flavor||r.item)+'</b> · '+r.label+'</span><span>'+fmt(r.onhand)+' / '+fmt(r.cap)+' '+r.unit+'</span></div>'+
      '<div class="bar"><i style="width:'+Math.min(100,f*100)+'%;background:'+color(f,over)+'"></i><u style="left:'+Math.min(100,f*100)+'%;width:'+pl*100+'%"></u></div>'+
      '<div style="color:#6B7B72;margin-top:2px">'+r.stage+(r.planned?' · +'+fmt(r.planned)+' planned':'')+(over?' · <b style="color:#D9473B">'+fmt(r.onhand+r.planned-r.cap)+' over capacity</b>':'')+'</div></div>';
  }
  function drawSide(rm){
    var list=rm[sel]||[],a=agg(list),s=$('side');
    var nm=(G[sel]||[])[4]||sel;
    var h='<h3>'+nm+'</h3><div class="sub">'+(list.length?Math.round(a.fill*100)+'% full'+(a.pl?' · projected '+Math.round(a.proj*100)+'% after production plan':'')+' · $'+fmt(a.val)+'K':'No tracked inventory in this room')+'</div>';
    var tk=list.filter(function(r){return r.container==='Tank'&&r.area==='Canning Line';});
    if(tk.length){h+='<div class="sub" style="margin:0 0 2px"><b>Canning line — tanks &amp; flavors</b></div><div class="tanks">'+tk.map(function(r){var f=r.cap?r.onhand/r.cap:0;var col={'Blood Orange':'#E8803A','Blueberry Lemonade':'#4D6FB3','Peach Mango':'#E5A06B','Watermelon Lime':'#5DAF6A'}[r.flavor]||'#7BC47F';
      return '<div class="tank"><div class="cyl"><i style="height:'+f*100+'%;background:'+col+'"></i></div><b>'+Math.round(f*100)+'%</b>'+r.label+'<br>'+r.flavor+'<br><span style="color:#14231C;font-weight:700">\u2248 '+fmt(r.onhand*CANS_PER_GAL)+' cans</span></div>';}).join('')+'</div>';
      var totc=tk.reduce(function(t,r){return t+r.onhand*CANS_PER_GAL;},0),totp=tk.reduce(function(t,r){return t+(r.cap-r.onhand)*CANS_PER_GAL;},0);
      h+='<div class="sub"><b>Expected output:</b> '+fmt(totc)+' x '+CAN_OZ+' oz cans from tank volume ('+fmt(totc/24)+' cases) \u00b7 '+fmt(totp)+' more cans of headroom</div>';}
    if(sel==='Warehouse'){var bp=agg(bevPallets());h+='<div class="sub"><b>Beverage pallet positions:</b> '+bp.on+' occupied + '+bp.pl+' planned of '+bp.cap+'</div>';}
    var rmat=list.filter(function(r){return r.area==='Raw Materials';});
    if(rmat.length){h+='<div class="sub" style="margin:4px 0 2px"><b>Raw material bins</b></div><div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px">'+rmat.filter(function(r){return r.unit==='bins';}).map(function(r){var f=r.cap?r.onhand/r.cap:0;return '<div title="'+r.item+'" style="width:54px;text-align:center;font-size:9px"><div style="height:34px;border:2px solid #14231C;border-top:none;border-radius:0 0 6px 6px;position:relative;overflow:hidden;background:#F4F8F5"><i style="position:absolute;left:0;right:0;bottom:0;height:'+f*100+'%;background:'+color(f,r.onhand+r.planned>r.cap)+'"></i></div>'+Math.round(f*100)+'%</div>';}).join('')+'</div>';}
    h+=list.map(bar).join('');
    if(flowOn){var rel=FLOW.filter(function(e){return e[0]===sel||e[1]===sel;});if(rel.length){h+='<div class="sub" style="margin-top:8px"><b>Connected rooms</b></div>'+rel.map(function(e){var o=e[0]===sel?e[1]:e[0],oa=agg(rm[o]||[]);return '<div class="row"><div class="hd"><span>'+(e[0]===sel?'\u2192 ':'\u2190 ')+(G[o]?G[o][4]:o)+' <span style="color:'+FCOL[e[3]]+'">('+e[2]+')</span></span><span>'+(oa.cap?Math.round(oa.fill*100)+'% full':'\u2014')+'</span></div></div>';}).join('');}}
    s.innerHTML=h;
  }

  function load(data){rows=data.map(norm);render();}
  load(synth);
  if(client){
    var unsub=null;
    client.config.subscribe(function(cfg){
      cfgNow=cfg;if(unsub)unsub();
      if(cfg&&cfg.source){
        unsub=client.elements.subscribeToElementData(cfg.source,function(d){
          var cols=COLS.filter(function(c){return cfg[c[0]]&&d[cfg[c[0]]];});
          if(cols.length<8)return;
          var n=d[cfg[cols[0][0]]].length,out=[];
          for(var i=0;i<n;i++){var o={};COLS.forEach(function(c){o[c[0]]=cfg[c[0]]&&d[cfg[c[0]]]?d[cfg[c[0]]][i]:'';});out.push(o);}
          load(out);
        });
      }
    });
  }
})();

</script>
</body>
</html>
